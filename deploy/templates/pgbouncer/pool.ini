; {{PRODUCT_NAME}} PgBouncer pool: {{POOL_NAME}} (generated by setup.sh)
[databases]
platform_db = host=127.0.0.1 port={{POSTGRES_PORT}} dbname=platform_db

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = {{POOL_PORT}}
unix_socket_dir =
auth_type = scram-sha-256
auth_file = {{CONFIG_DIR}}/pgbouncer/{{POOL_NAME}}-users.txt
admin_users = {{POOL_ADMIN_USERS}}
stats_users = pgbouncer_stats
pool_mode = transaction
max_client_conn = {{POOL_MAX_CLIENT_CONN}}
default_pool_size = {{POOL_DEFAULT_SIZE}}
min_pool_size = 0
reserve_pool_size = 2
max_db_connections = {{POOL_MAX_DB_CONNECTIONS}}
reserve_pool_timeout = 3
server_idle_timeout = 60
server_lifetime = 3600
server_connect_timeout = 10
query_timeout = 30
client_idle_timeout = 300
idle_transaction_timeout = 30
ignore_startup_parameters = extra_float_digits
application_name_add_host = 1
server_fast_close = 1
logfile =
pidfile = /run/{{APP_SLUG}}-pgbouncer-{{POOL_NAME}}/pgbouncer.pid
