# {{PRODUCT_NAME}} PostgreSQL settings (generated by setup.sh)
listen_addresses = '127.0.0.1'
port = {{POSTGRES_PORT}}
unix_socket_directories = '/run/{{APP_SLUG}}-postgresql'
password_encryption = 'scram-sha-256'
max_connections = 200
shared_buffers = '256MB'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = '2s'
log_lock_waits = on
